name: appfig_flutter
description: AppFig for Flutter. Feature flags, remote config and A/B tests evaluated on the device, through the native AppFig SDKs for Android and iOS.
version: 2.3.0
homepage: https://appfig.com
repository: https://github.com/smartconfigui/AppFig-SDKs

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.appfig.flutter
        pluginClass: AppfigFlutterPlugin
      ios:
        pluginClass: AppfigFlutterPlugin
